    <rect x="115" y="410" width="22" height="204" rx="11" fill="#00bcd4" opacity="0.7"/>
    <rect x="152" y="340" width="22" height="344" rx="11" fill="#00d4e0" opacity="0.75"/>
    <rect x="189" y="375" width="22" height="274" rx="11" fill="#00bcd4" opacity="0.7"/>
    <rect x="226" y="295" width="22" height="434" rx="11" fill="#00e5ff" opacity="0.8"/>
    <rect x="263" y="350" width="22" height="324" rx="11" fill="#00bcd4" opacity="0.7"/>
    <rect x="300" y="275" width="22" height="474" rx="11" fill="#00e5ff" opacity="0.85"/>
    <rect x="337" y="330" width="22" height="364" rx="11" fill="#00d4e0" opacity="0.75"/>
    <rect x="374" y="255" width="22" height="514" rx="11" fill="#00e5ff" opacity="0.9"/>
    <rect x="411" y="305" width="22" height="414" rx="11" fill="#00d4e0" opacity="0.8"/>

