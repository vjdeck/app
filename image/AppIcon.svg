    <rect x="884" y="350" width="22" height="324" rx="11" fill="#00bcd4" opacity="0.75"/>
    <rect x="921" y="395" width="22" height="234" rx="11" fill="#00bcd4" opacity="0.65"/>

    <!-- Playhead line -->
    <rect x="456" y="220" width="3" height="584" rx="1.5" fill="#00e5ff" opacity="0.6"/>

  </g>
</svg>
