name: Clean build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify CI toolchain
        run: |
          test "$(uname -m)" = arm64 || { echo '::error::Apple Silicon runner required'; exit 1; }
          test "$(xcodebuild -version | head -n 1)" = 'Xcode 16.3' || { echo '::error::Xcode 16.3 required'; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Bootstrap dependencies
        run: |
          ./scripts/bootstrap.sh
          ./scripts/bootstrap.sh --verify-only
      - name: Verify FFmpeg rebuild sources
        run: Tests/Scripts/build-ffmpeg-source-tests.sh
      - name: Release script tests
        run: python3 Tests/Scripts/release-tests.py
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Debug tests
        run: |
          xcodebuild -project VJDeck.xcodeproj -scheme VJDeck -configuration Debug \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/VJDeck-DerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Release tests
        run: |
          xcodebuild -project VJDeck.xcodeproj -scheme VJDeck -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/VJDeck-DerivedData" \
            -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test
      - name: Release app build
        run: |
          xcodebuild -project VJDeck.xcodeproj -scheme VJDeck -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath "$RUNNER_TEMP/VJDeck-DerivedData" \
            CODE_SIGNING_ALLOWED=NO build
